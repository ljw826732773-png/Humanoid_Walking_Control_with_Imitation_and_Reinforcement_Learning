<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1f2933}
.title{font-size:28px;font-weight:700}
.subtitle{font-size:15px;fill:#52606d}
.metric{font-size:30px;font-weight:700;fill:#102a43}
.label{font-size:14px;fill:#52606d}
.step{font-size:13px;font-weight:700;fill:#102a43}
.note{font-size:12px;fill:#627d98}
</style>
<rect width="1160" height="620" fill="#f8fafc"/>
<rect x="24" y="24" width="1112" height="572" rx="18" fill="#ffffff" stroke="#d9e2ec"/>
<text class="title" x="52" y="70" text-anchor="start">Humanoid Walking Control Portfolio Dashboard</text>
<text class="subtitle" x="52" y="96" text-anchor="start">Enhanced behavior cloning with normalization, closed-loop checkpoint selection, diagnostics, and reproducible artifacts.</text>
<rect x="52" y="132" width="330" height="92" rx="12" fill="#f0f4f8" stroke="#d9e2ec"/>
<rect x="52" y="132" width="6" height="92" rx="3" fill="#8a8f98"/>
<text class="label" x="74" y="166" text-anchor="start">Original BC avg steps</text>
