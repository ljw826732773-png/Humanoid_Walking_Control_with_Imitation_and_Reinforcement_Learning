<rect x="52" y="248" width="6" height="92" rx="3" fill="#8a8f98"/>
<text class="label" x="74" y="282" text-anchor="start">Stability avg steps</text>
<text class="metric" x="74" y="318" text-anchor="start">820.3</text>
<rect x="410" y="248" width="330" height="92" rx="12" fill="#f0f4f8" stroke="#d9e2ec"/>
<rect x="410" y="248" width="6" height="92" rx="3" fill="#2f80ed"/>
<text class="label" x="432" y="282" text-anchor="start">Robustness avg steps</text>
