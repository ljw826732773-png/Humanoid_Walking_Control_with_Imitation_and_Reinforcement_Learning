<text class="title" x="52" y="392" text-anchor="start">Experiment Pipeline</text>
<rect x="52" y="430" width="188" height="72" rx="14" fill="#e6f6ff" stroke="#9ed9f7"/>
<text class="step" x="146.0" y="472" text-anchor="middle">Expert Dataset</text>
<line x1="248" y1="466.0" x2="282" y2="466.0" stroke="#627d98" stroke-width="2"/>
<polygon points="282,466.0 273,460.0 273,472.0" fill="#627d98"/>
<rect x="266" y="430" width="188" height="72" rx="14" fill="#e6f6ff" stroke="#9ed9f7"/>
