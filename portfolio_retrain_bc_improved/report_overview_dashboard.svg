<rect x="410" y="132" width="6" height="92" rx="3" fill="#2f80ed"/>
<text class="label" x="432" y="166" text-anchor="start">Enhanced BC avg steps</text>
<text class="metric" x="432" y="202" text-anchor="start">839.2</text>
<rect x="768" y="132" width="330" height="92" rx="12" fill="#f0f4f8" stroke="#d9e2ec"/>
<rect x="768" y="132" width="6" height="92" rx="3" fill="#2f80ed"/>
